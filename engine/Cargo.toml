[package]
name = "fractadactyl"
version = "0.1.0"
edition = "2021"
description = "Endless Mandelbrot zooms via hidden twin-minibrot swaps (DEC-02, DEC-05)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fz"
path = "src/main.rs"

[dependencies]
dashu-float = "0.6.2"
dashu-base = "0.6.1"
num-complex = "0.4.6"
rayon = "1.12.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ab_glyph"] }
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"

[profile.release]
debug = false
codegen-units = 1
lto = "thin"

[profile.dev]
opt-level = 2
